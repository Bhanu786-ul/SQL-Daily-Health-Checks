
---
- name: Test TCP connectivity from AAP
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Test WinRM port 5986
      ansible.builtin.wait_for:
        host: 138.95.222.146
        port: 5986
        timeout: 10
        state: started

    - name: Connectivity successful
      ansible.builtin.debug:
        msg: "SUCCESS - AAP can reach Windows server on TCP 5986"
