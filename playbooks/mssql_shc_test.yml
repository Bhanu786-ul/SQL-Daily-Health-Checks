---
- name: SQL Daily Health Check
  hosts: all
  gather_facts: no

  tasks:

    - name: Copy PowerShell Script
      ansible.windows.win_copy:
        src: ../scripts/SQL_Daily_Health_Check.ps1
        dest: C:\Windows\Temp\SQL_Daily_Health_Check.ps1

    - name: Execute Health Check Script
      ansible.windows.win_shell: |
        & "C:\Windows\Temp\SQL_Daily_Health_Check.ps1"
      register: health_result

    - name: Display Health Check Output
      debug:
        var: health_result.stdout_lines
